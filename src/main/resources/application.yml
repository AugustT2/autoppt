server:
  port: 8080

# LangChain4j Spring Boot Starter（OpenAI 兼容，DashScope 等同理配置 base-url）
# 文档：https://docs.langchain4j.dev/tutorials/spring-boot-integration/
langchain4j:
  open-ai:
    chat-model:
      base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:${LLM_API_KEY:}}
      model-name: ${LLM_MODEL:qwen-turbo}
      timeout: 120s
      log-requests: true
      log-responses: true

ppt:
  refresh:
    rules-dir: classpath:rules
    slide-index-base: 0
    # cache-only：只改 chart 缓存/公式，不重写嵌入 xlsx（避免 PowerPoint 修复/打不开）
    chart-write-mode: cache-only
    llm:
      enabled: true

resilience4j:
  retry:
    instances:
      llmChat:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.net.SocketTimeoutException
          - java.io.IOException
      toolHttp:
        max-attempts: 3
        wait-duration: 500ms
