server:
  port: 8080

# LangChain4j Spring Boot Starter（OpenAI 兼容，DashScope 等同理配置 base-url）
# 文档：https://docs.langchain4j.dev/tutorials/spring-boot-integration/
langchain4j:
  open-ai:
    chat-model:
      base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:${LLM_API_KEY:}}
      model-name: ${LLM_MODEL:qwen-plus}
      timeout: 120s
      log-requests: false
      log-responses: false

ppt:
  refresh:
    rules-dir: classpath:rules
    slide-index-base: 0
    llm:
      # false 时走 StubLlmTaskRunner，不调用 ChatModel（与是否配置 api-key 无关）
      enabled: true

resilience4j:
  retry:
    instances:
      llmChat:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.net.SocketTimeoutException
          - java.io.IOException
      toolHttp:
        max-attempts: 3
        wait-duration: 500ms
