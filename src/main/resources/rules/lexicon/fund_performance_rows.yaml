# PPT 表头区间文案 → 解析策略（IntervalConditionResolver）
# 标签须与模板单元格原文一致；同义写法可多条映射到同一 strategy
labels:
  # --- 滚动区间 ---
  近一周: ROLLING_7D
  近一月: ROLLING_1M
  近三月: ROLLING_3M
  近六月: ROLLING_6M
  近六个月: ROLLING_6M
  过去六个月: ROLLING_6M
  近一年: ROLLING_1Y
  过去一年: ROLLING_1Y
  近两年: ROLLING_2Y
  过去两年: ROLLING_2Y
  近三年: ROLLING_3Y
  过去三年: ROLLING_3Y
  近五年: ROLLING_5Y
  # --- 今年以来 / YTD ---
  今年以来: YTD
  YTD: YTD
  # --- 任职 / 成立 ---
  成立以来: SINCE_INCEPTION
  任职以来: SINCE_MANAGER_TENURE
  # --- 自然年（表头常为「2025年」）---
  2026年: CALENDAR_YEAR_2026
  2025年: CALENDAR_YEAR_2025
  2024年: CALENDAR_YEAR_2024
  2023年: CALENDAR_YEAR_2023
  2022年: CALENDAR_YEAR_2022
