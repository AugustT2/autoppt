deckType: "混合固收+-M1"
version: "1"

productNameResolution:
  strategy: LLM_EXTRACT
  slideIndex: 0
  hint: "标题形如「任意前缀-产品名」，只输出连字符后的产品展示名，不要前缀、不要解释"

timeRules:
  - latestQuarter
  - latestDate

tasks:
  - id: sample_title
    type: text
    slideIndex: 0
    anchorText: "基金业绩说明"
    mode: replace_all
    intent: "生成一行标题，包含产品名称与最新季度说明"

  - id: sample_rank_table
    type: table
    slideIndex: 0
    tableOrdinal: 1
    intent: "刷新本页指标矩阵：依据矩阵识别全部区间标签与指标行标题，仅更新数据格；标签须为矩阵原文；行列结构与模板一致"
    dimensionPolicy:
      policyType: table_interval_labels
      lexicon: /rules/lexicon/fund_performance_rows.yaml
      metricsLexicon: /rules/lexicon/table_metrics.yaml

  - id: sample_allocation_chart
    type: chart
    slideIndex: 0
    chartOrdinal: 1
    intent: "更新资产配置柱状图数据，系列数与模板一致"
