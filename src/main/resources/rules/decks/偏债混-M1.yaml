deckType: "偏债混-M1"
version: "2"

# 左上信息块「基金名称：xxx」提取展示名（去掉（示例）等后缀）
productNameResolution:
  strategy: ANCHOR_REGEX
  slideIndex: 0
  anchorText: "基金名称"
  pattern: "基金名称[：:]\\s*([^（(\\n]+)"

timeRules:
  - latestQuarter
  - latestDate

tasks:
  - id: title
    type: text
    slideIndex: 0
    anchorText: "基金业绩说明"
    mode: replace_all
    intent: "更新页主标题（示例页可为「基金业绩说明」及数据截止说明）"

  - id: fund_meta
    type: text
    slideIndex: 0
    # 锚点在「基金名称：」之后整段可替换内容（勿用单独标题框「基金基本情况」）
    anchorText: "基金名称："
    mode: after_anchor
    intent: "更新基金名称、类型、成立日、规模、基金经理、业绩比较基准、风险等级、托管人等基本信息"

  - id: yield_ranking_table
    type: table
    slideIndex: 0
    tableOrdinal: 1
    intent: "更新「收益率排名」表全部单元格（列：区间、收益率、同类排名、分位数；行数与模板一致）"

  - id: allocation_chart
    type: chart
    slideIndex: 0
    chartOrdinal: 1
    intent: "更新「过去4个季度资产类别配置」分组柱状图（横轴 categories=季度如2024Q2；series=股票/债券/现金及其他）"

  - id: nav_chart
    type: chart
    slideIndex: 0
    chartOrdinal: 2
    intent: "更新「累计收益率走势」折线图（本基金与业绩基准两条系列）"
    hints: "折线系列名：本基金=productDisplayName；业绩基准=业绩比较基准或沪深300复合基准"
