deckType: "偏债混-M1"
version: "2"

# 「基金基本情况」块首行多为「产品线-展示名」（如 偏债混-蓝海稳健增长混合A），由 LLM 只取连字符后作为 productDisplayName
productNameResolution:
  strategy: LLM_EXTRACT
  slideIndex: 0
  hint: "在「基金基本情况」信息块中，首行常为「产品线前缀-基金展示名」（示例：偏债混-中欧医疗A）。只输出英文连字符或中文破折号后的基金展示名（示例：中欧医疗A），不要产品线前缀、不要括号内说明、不要解释。"
  # LLM 未解析成功时回退正则
  anchorText: "基金类型"
  pattern: "偏债混-([^\\n（(]+)"

timeRules:
  - latestQuarter
  - latestDate

reporting:
  managerTenureRule: EARLIEST

tasks:
  - id: fund_latest_scale
    type: text
    slideIndex: 0
    anchorText: "最新规模"
    fieldLabel: "最新规模"
    mode: replace_labeled_number
    intent: "仅将「最新规模」后的数字更新为按 fundCode 查询的最新规模；勿改标签、单位及其它字段"

  - id: yield_ranking_table
    type: table
    slideIndex: 0
    tableOrdinal: 1
    intent: "刷新本页业绩指标矩阵：依据下方矩阵识别全部区间标签（时间维度）与全部指标行标题（收益/排名/基准/风险等），仅更新指标与区间交叉的数据格；intervalLabels、metrics 必须为矩阵中出现的原文，具体名称因产品模板而异，勿臆造或改用词表同义词；保持表头、角落标签与行列结构不变"
    dimensionPolicy:
      policyType: table_interval_labels
      # 区间/指标具体文案以 PPT 矩阵为准；可识别标签见 lexicon / metricsLexicon
      lexicon: /rules/lexicon/fund_performance_rows.yaml
      metricsLexicon: /rules/lexicon/table_metrics.yaml

  - id: allocation_chart
    type: chart
    slideIndex: 0
    chartOrdinal: 1
    intent: "更新右上「大类资产配置情况（%）」分组柱状图数据（勿改标题与版式）：横轴=股票、可转债、利率债、信用债；系列=以 asOfQuarter 为右端向前滚动 4 个季度；系列值为各季度大类资产占比"
    dimensionPolicy:
      policyType: asset_class_allocation
      chartCategories:
        - 股票
        - 可转债
        - 利率债
        - 信用债
      categoryCount: 4

  - id: nav_chart
    type: chart
    slideIndex: 0
    chartOrdinal: 2
    intent: "更新右下累计收益折线图：系列 0=模板本基金图例，系列 1..N=模板各基准图例；横轴以模板日/月标签为准"
    hints: "勿改系列条数与图例原文；按 queryPlan.chartSeries 逐系列、逐横轴时点取累计收益"
    dimensionPolicy:
      policyType: nav_line_series
      benchmarksLexicon: nav_benchmarks.yaml
