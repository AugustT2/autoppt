deckType: "偏债混-M1"
version: "2"

# 「基金基本情况」块首行多为「产品线-展示名」（如 偏债混-蓝海稳健增长混合A），由 LLM 只取连字符后作为 productDisplayName
productNameResolution:
  strategy: LLM_EXTRACT
  slideIndex: 0
  hint: "在「基金基本情况」信息块中，首行常为「产品线前缀-基金展示名」（示例：偏债混-中欧医疗A）。只输出英文连字符或中文破折号后的基金展示名（示例：中欧医疗A），不要产品线前缀、不要括号内说明、不要解释。"
  # LLM 未解析成功时回退正则
  anchorText: "基金类型"
  pattern: "偏债混-([^\\n（(]+)"

timeRules:
  - latestQuarter
  - latestDate

reporting:
  managerTenureRule: EARLIEST

